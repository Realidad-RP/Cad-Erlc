<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Cargando…</title>
  <style>
    :root { --accent: #3b82f6; }
    * { margin: 0; box-sizing: border-box; user-select: none; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 100% at 50% 0%, #16202e 0%, #0b1015 55%, #070c11 100%);
      color: #e6edf5;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Anillo giratorio alrededor del escudo */
    .ring {
      position: relative;
      width: 152px;
      height: 152px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop .75s cubic-bezier(.2, .9, .3, 1.25) both;
    }
    .ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(59, 130, 246, .16);
      border-top-color: var(--accent);
      animation: spin 1.1s linear infinite;
    }
    .ring::after {
      content: '';
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(59, 130, 246, .25);
    }
    .ring img {
      width: 108px;
      height: 108px;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .6));
      animation: breathe 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    @keyframes pop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }

    h1 {
      margin: 24px 0 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: .5px;
      animation: up .7s .15s ease both;
      text-align: center;
      padding: 0 20px;
    }
    h1 .hl { color: var(--accent); }

    p {
      margin: 9px 0 0;
      font-size: 11px;
      color: #8ba1b8;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      animation: up .7s .3s ease both;
    }

    /* Barra de carga animada */
    .bar {
      width: 270px;
      height: 4px;
      margin-top: 28px;
      border-radius: 4px;
      background: #1a2534;
      overflow: hidden;
      animation: up .7s .45s ease both;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 42%;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: slide 1.25s ease-in-out infinite;
    }

    @keyframes slide { from { transform: translateX(-115%); } to { transform: translateX(365%); } }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .footer {
      position: fixed;
      bottom: 14px;
      font-size: 10px;
      color: #59708a;
      letter-spacing: 1px;
      animation: up .8s .6s ease both;
    }
  </style>
</head>
<body>
  <div class="ring">
    <img src="./assets/logo.png" alt="Escudo" draggable="false" />
  </div>
  <h1>CAD <span class="hl">| AYUNTAMIENTO |</span> Los Angeles</h1>
  <p>Sistema de despacho y radio</p>
  <div class="bar"><i></i></div>
  <div class="footer">INICIANDO SERVICIOS…</div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 300" role="img" aria-labelledby="lapdTitle">
  <title id="lapdTitle">Los Angeles Police Department badge</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a6"/>
      <stop offset=".18" stop-color="#e7bf62"/>
      <stop offset=".42" stop-color="#fff0b8"/>
      <stop offset=".62" stop-color="#c9922f"/>
      <stop offset=".82" stop-color="#f5d987"/>
      <stop offset="1" stop-color="#9c6a16"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".35" stop-color="#dcae4d"/>
      <stop offset=".7" stop-color="#8f5f12"/>
      <stop offset="1" stop-color="#f4d47c"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12233e"/>
      <stop offset=".48" stop-color="#081426"/>
      <stop offset="1" stop-color="#040c18"/>
    </linearGradient>
    <radialGradient id="gloss" cx=".36" cy=".18" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3a60"/>
      <stop offset="1" stop-color="#09182c"/>
    </linearGradient>
  </defs>

  <!-- outer shield -->
  <path d="M120 10 C150 24 178 30 217 32 C217 132 200 216 120 278 C40 216 23 132 23 32 C62 30 90 24 120 10 Z"
        fill="url(#navy)" stroke="url(#goldEdge)" stroke-width="9" stroke-linejoin="round"/>
  <path d="M120 18 C148 31 174 37 208 39 C208 130 192 207 120 266 C48 207 32 130 32 39 C66 37 92 31 120 18 Z"
        fill="none" stroke="url(#gold)" stroke-width="2.2" opacity=".95"/>
  <path d="M120 10 C150 24 178 30 217 32 C217 132 200 216 120 278 C40 216 23 132 23 32 C62 30 90 24 120 10 Z"
        fill="url(#gloss)"/>

  <!-- top lettering (arched, one glyph at a time for maximum compatibility) -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700"
     text-anchor="middle" fill="url(#gold)">
    <text x="68.4" y="51.3" transform="rotate(-35 68.4 51.3)">L</text>
    <text x="77.7" y="45.5" transform="rotate(-28 77.7 45.5)">O</text>
    <text x="87.7" y="41.0" transform="rotate(-21 87.7 41.0)">S</text>
    <text x="109.0" y="35.7" transform="rotate(-7 109.0 35.7)">A</text>
    <text x="120.0" y="35.0">N</text>
    <text x="131.0" y="35.7" transform="rotate(7 131.0 35.7)">G</text>
    <text x="141.8" y="37.7" transform="rotate(14 141.8 37.7)">E</text>
    <text x="152.3" y="41.0" transform="rotate(21 152.3 41.0)">L</text>
    <text x="162.3" y="45.5" transform="rotate(28 162.3 45.5)">E</text>
    <text x="171.6" y="51.3" transform="rotate(35 171.6 51.3)">S</text>
  </g>

  <!-- center seal -->
  <g>
    <circle cx="120" cy="128" r="35" fill="url(#seal)" stroke="url(#gold)" stroke-width="2.4"/>
    <circle cx="120" cy="128" r="29.5" fill="none" stroke="#e8c470" stroke-width=".8" opacity=".8"/>
    <!-- skyline -->
    <g fill="#d8b25c">
      <rect x="100" y="136" width="7" height="15" rx=".8"/>
      <rect x="109" y="131" width="8" height="20" rx=".8"/>
      <rect x="119" y="126" width="5" height="25" rx=".8"/>
      <rect x="126" y="133" width="8" height="18" rx=".8"/>
      <rect x="136" y="138" width="7" height="13" rx=".8"/>
      <path d="M120 116 l2.6 5.4 6 .8 -4.4 4.2 1.1 6 -5.3 -2.9 -5.3 2.9 1.1 -6 -4.4 -4.2 6 -.8 Z"/>
    </g>
    <path d="M94 154 h52" stroke="#d8b25c" stroke-width="1.1" opacity=".9"/>
  </g>

  <!-- main lettering -->
  <text x="120" y="203" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="28" font-weight="700" letter-spacing=".4" fill="url(#gold)">POLICE</text>
  <path d="M66 211 H174" stroke="#c79a42" stroke-width=".9" opacity=".75"/>
  <text x="120" y="227" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="8.8" font-weight="700" letter-spacing="2.3" fill="#e6c26b">DEPARTMENT</text>

  <!-- bottom detail -->
  <g opacity=".9">
    <path d="M100 239 h40" stroke="#c79a42" stroke-width=".8"/>
    <text x="120" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="5.8"
          font-weight="700" letter-spacing="1.8" fill="#cfa956">EST. 1869</text>
  </g>

  <!-- tiny side rivets -->
  <circle cx="54" cy="120" r="1.7" fill="#f3d98f"/>
  <circle cx="186" cy="120" r="1.7" fill="#f3d98f"/>
</svg>

# Despliegue automático en Render.com (plan gratuito)
# 1) Subí este proyecto a GitHub (ya está hecho).
# 2) En Render: New + -> Blueprint -> elegí tu repositorio.
# 3) Render leerá este archivo y creará el servidor de radio automáticamente.
# 4) Copiá la URL wss://... y pegala en la app (campo "Servidor").
#
# Para TURN (redes estrictas), completá las variables TURN_* en el panel de Render.

services:
  - type: web
    name: cad-erlc-radio
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  # Bot de Discord: enlaza el CAD y el servidor de RP de ER:LC con tu Discord.
  # Paso a paso: bot/README.md
  - type: web
    name: cad-erlc-bot
    runtime: node
    rootDir: bot
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: ERLC_SERVER_KEY
        sync: false
      - key: CAD_KEY
        sync: false
      - key: CH_DESPACHO
        sync: false
      - key: CH_BOLO
        sync: false
      - key: CH_ERLC
        sync: false
      - key: CH_ESTADO
        sync: false
